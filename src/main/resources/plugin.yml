name: Gesturing
version: '${version}'
main: dev.ledge.gesturing.GesturingPlugin
api-version: '1.8'
description: Standalone Paper/Paper 1.8.8 gesture and seating plugin.
commands:
  sit:
    description: Sit on the supporting block or toggle player sitting.
    usage: /sit [toggle|playertoggle]
    permission: gesturing.sit
  lay:
    description: Lie down facing a compass direction.
    usage: /lay <east|west|south|north>
    permission: gesturing.lay
  stand:
    description: Stop your current gesture.
    usage: /stand
    permission: gesturing.stand
permissions:
  gesturing.sit:
    default: true
  gesturing.lay:
    default: true
  gesturing.stand:
    default: true
