plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories { }

dependencies {
    annotationProcessor 'com.pkware.jabel:jabel-javac-plugin:1.0.1-2'
    compileOnly 'com.pkware.jabel:jabel-javac-plugin:1.0.1-2'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Ship the Fabric API modules this mod uses inside the jar (jar-in-jar): players only need Fabric Loader.
    ["fabric-api-base", "fabric-command-api-v1", "fabric-lifecycle-events-v1", "fabric-networking-api-v1"].each { include fabricApi.module(it, project.fabric_api_version) }
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    serverOnlyMinecraftJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '17'
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.test { useJUnitPlatform() }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('../LICENSE') {
        rename { "${it}_Gesturing" }
    }
}
